name: Pruebas de Mitca
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/pruebas.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/pruebas.yml'
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
